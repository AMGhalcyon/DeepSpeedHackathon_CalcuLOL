# Your tuning lives here. Loaded with:
#   ros2 run team_driver driver --ros-args --params-file \
#       /hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# or in an evaluation run:
#   ros2 launch roboracer_referee evaluate.launch.py team:=my_team \
#       driver_params:=/hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# Keeping the numbers out of the code means you can sweep them without
# rebuilding, which is the fastest way to find lap time early on.
#
# EVERYTHING lives under `driver: ros__parameters:`. ROS reads a top-level key
# as a NODE name, so a block placed beside `driver:` (the MPC block used to be
# one) is silently ignored. Nested keys become dotted parameter names:
# `mpc: q_pos:` is the parameter `mpc.q_pos`.
#
# Declaring a parameter happens in ONE place, team_driver/driver_params.py. Every
# value below equals that table's default, so loading this file changes nothing
# (test_driver_params.py enforces it). Change a number here to retune; keep the
# YAML type, since ROS refuses `3` for a parameter declared as `3.0`.
#
# Proof the file arrived: the driver logs `params_source = driver_params.yaml`
# at startup, followed by every resolved value. `CODE_DEFAULTS` there means the
# file was NOT loaded and the code defaults are running.
#
# A bare `ros2 run team_driver driver`, and scripts/evaluate.sh without
# --driver-params, never read this file: they run the table in driver_params.py.
# So to change what a SCORED run does, pass --driver-params to the evaluation
# or change the default in driver_params.py (and keep the two equal).

driver:
  ros__parameters:
    use_sim_time: true
    params_source: "driver_params.yaml"   # sentinel; the code default is "CODE_DEFAULTS"

    scan_topic: "/scan"
    odom_topic: "/ego_racecar/odom"
    drive_topic: "/drive"

    crawl_speed: 1.0          # [m/s] the emergency cap never asks for less
    max_range: 8.0            # [m] clip the scan here
    # [m/s] Cap on the profile and the emergency bound. Binds only at the end of the
    # longest straight (the plant tops out near 12.1); 0.14 s/lap at a25 over 10.
    v_max: 12.0
    # Speed profile (speed_profile.py). a_lat_max is a slip budget, not a grip
    # limit: the plant's tyres are linear, so rear slip is a_y / 56.1 rad.
    # Sub-9 Step 2, with the MPC owning the braking (the three fields below) and
    # v_max 12: 27 is 8.79 s, clean on fixed 5/7/12 ms x stale 5/9/14, 10 laps,
    # 5 measured, 24 runs under 12-job host load, and the centreline (10.97 s).
    # a28 hit the chicane exit (s 45.4) on 1 of 3 cells. Old car: a21, v_max 10.
    a_lat_max: 27.0           # [m/s^2] cornering budget, held lower in sector_scale
    lock_margin: 0.95         # fraction of the steering lock the profile may use
    a_accel_max: 9.51         # [m/s^2] acceleration the profile plans (plant: 9.51)
    # Braking the profile plans, and the most the conditioner passes on from
    # the MPC (plant: 9.51). The profile and emergency caps may brake harder.
    # Sub-9 phase 2: 9, with gg_exponent 5 and curvature_smooth 21 (shape U). Old car: 6.
    a_brake_max: 9.0          # [m/s^2]
    # Sub-9 Step 2 (driver_core.DriverConfig has the why). false/9.51/0.5 is the old car.
    mpc_full_brake: true      # the MPC plans braking to a_brake_max, not -0.3 a_max
    profile_brake_cap: 3.0    # [m/s^2] most the profile override brakes past the MPC
    beta_limit: 1.0           # [rad] measured sideslip past this reads 0 to the MPC
    # Sectors where the slip budget is scaled: flat (s_start, s_end, scale)
    # triples, s [m] along the raceline from its first point, scale in (0, 1.5]
    # (above 1 raises it). Sub-10 Step 4, on that era's min-time line:
    # s 43-47 at 0.85 for the chicane-exit tracking transient (s~45.3 collides without
    # it), s 3-7 at 0.95 for the first corner (s~4.8-5.2 collided on the new line).
    # The g-g brake limit covers the braking-yaw sites the older sectors patched.
    # Never empty: ROS would type an empty list as bytes and refuse a list of
    # doubles; to turn the sectors off, use [0.0, 1.0, 1.0]. Tuned on the shipped
    # line at raceline_margin 0.25; on the centreline the lap gets a uniform a_lat_max x
    # the lowest scale (27 x 0.85 = 22.95 m/s^2: clean in lap_sim, 9.37 s at the
    # phase-2 profile; 10.97 s at the sub-9 Step 2 one).
    # Fallbacks: the sub-10 car (a21, v_max 10, mpc_full_brake false, profile_brake_cap
    # 9.51, beta_limit 0.5; 9.82 s harness, judged 9.87 s), or the previous line and
    # profile (git 42cb78f, 10.81 s). Sub-9 Step 2 ran a27 on those two sectors alone.
    # Sub-9 phase 2, on the line re-refined at that profile (raceline.REFINE_PROFILE;
    # arcs shifted 0.1-0.2 m to its length): scales above 1 raise the budget, one
    # notch below each corner's harness cliff -- 8-21 and 57-74 at 1.2, 28-43 and
    # 49-57 at 1.11 (28-43 at 1.2 hit s 30-36 in 3 of 10 judged runs). 7.97 s harness.
    # driver_core.DriverConfig has the cliffs. Fallback: git aadb7ae (a27, 8.80 s).
    sector_scale: [43.2, 47.2, 0.85, 3.1, 7.1, 0.95, 8.1, 21.3, 1.2,
                   28.3, 43.2, 1.11, 49.2, 57.2, 1.11, 57.2, 74.4, 1.2]
    # Combined-accel limit on the profile's braking (speed_profile.gg_decel): the
    # deceleration into a corner shrinks with the share of a_lat_max the corner already
    # uses, a_brake_max * max(gg_floor, 1 - r^p)^(1/p), p = gg_exponent. Braking unloads the rear axle
    # and the plant's yaw goes unstable, which is what crashed every uniform budget
    # above 18 (sub-10 Step 1). Off reproduces the plain profile bit for bit.
    gg_brake: true
    gg_floor: 0.1             # braking never drops below a_brake_max*gg_floor^(1/p), in (0, 1]
    gg_exponent: 5.0          # shape of that ellipse, 1 - r^p; 2 is the ellipse (old car)
    curvature_smooth: 21      # [points] the profile's curvature moving average (odd); not the MPC's; old car 9
    # Cautious out lap and warm-up lap (neither timed; their collisions still count
    # toward the DQ). Until warmup_crossings start-line crossings and then arc
    # warmup_end_s [m], the profile also takes warmup_sector_scale (scales in
    # (0, 1]) and every acceleration limit is scaled by warmup_accel_scale.
    # 0 crossings is off. Never-empty list: [0.0, 1.0, 1.0] is no sector.
    # Pinned: the warm-up lap at 0.35 of the budget and half the acceleration up to
    # the last corner's exit (s 56), against judged blind spells early in a run
    # (driver_core.DriverConfig has the why). Warm-up 12.5 s; timed laps unchanged.
    warmup_crossings: 1
    warmup_end_s: 56.0
    warmup_sector_scale: [0.0, 56.0, 0.35]
    warmup_accel_scale: 0.5
    # Back off a wall the car is pinned against (phase-2 judged r1: pinned at full
    # lock and full throttle after one hit, 11 collisions, DQ). Pinned = under 1.0 m/s
    # while asking to move, for unstick_after [s], once the car has passed 2 m/s;
    # then reverse at unstick_speed [m/s] for unstick_reverse_s [s], counter-steered
    # (full lock against the last forward steer), longer on each repeat (up to
    # 1.5 s). 0 is off.
    unstick_after: 0.5
    unstick_reverse_s: 0.6
    unstick_speed: 1.0
    a_emergency: 7.0          # [m/s^2] braking the emergency cap assumes; coasting sheds speed at it
    # Continue the emergency cap's corridor past the MPC's 0.5 s plan along the
    # reference, not straight into the outside wall of the next corner (sub-10 Step 3).
    cap_follows_reference: true
    steer_limit: 0.4189       # [rad] the real lock
    # Reference line the MPC tracks: "centerline" (the shipped CSV) or "raceline":
    # the offline min-time line in config/icra26_raceline.csv, once it checks out
    # against the map; else minimum curvature, built from the map at startup.
    reference: "raceline"
    raceline_margin: 0.25     # [m] clearance beyond the car's half-width kept from walls

    # Output conditioning (driver_core._condition / _coast)
    stop_margin: 0.0          # [m] clearance the emergency cap keeps beyond the body's overhang
    coast_steer_rate: 1.0     # [rad/s] steering decay toward straight while coasting
    accel_limit: 9.51         # [m/s^2] most acceleration the conditioner passes on
    # Plan from where the car will be when the command latches (latch_predictor.py);
    # false plans from the measured, dead-time-old state.
    predict_latch: true

    # The control timer. Must equal mpc.dt: the model assumes each command is
    # held for exactly one MPC step, and the node refuses to start otherwise.
    control_period: 0.025     # [s] (40 Hz)

    # The MPC's prediction model. "KS": kinematic, sideslip pinned at 0. "ST":
    # the judged dynamic single track (linear tyres), started from odometry's
    # real sideslip and yaw rate; it adds the yaw rate as a seventh state.
    vehicle:
      model: "ST"

    # MPC Controller Parameters
    #
    # NOTE: horizon is capped by solve time, not by taste. The control loop runs
    # once per LiDAR scan at 40 Hz, so a solve has a 25 ms budget. Measured on this
    # machine on the vectorized cost, over a full 700-step lap:
    #     horizon  8 ->  30.3 ms mean, 41.0 ms max   (ALREADY OVER BUDGET)
    #     horizon 12 -> 139 ms      horizon 16 -> 239 ms      horizon 32 -> 589 ms
    # Those figures are for 16 free variables. Move blocking (block_map below) cuts
    # them to 6 while keeping 8 steps; dt_schedule (below) stretches those to a
    # 0.5 s lookahead at no extra cost. Do NOT raise the horizon to buy lookahead:
    # the scaling is super-linear. Do NOT go back to 16 variables with the 15 ms
    # solve_budget_ms: a cold solve then never finishes inside the budget, every
    # solve falls back to the (zero) warm start, and the car never moves.
    #
    # Weights (tuned 2026-09-28 on maps/icra26_centerline.csv, 700-step lap):
    #   The state-tracking to control-rate ratio must exceed 1. A 0.2 m reference snap
    #   has to cost more than the steering reversal it causes, or the optimizer
    #   chatters: at the old weights a snap was ~57x cheaper than the reversal. Swept
    #   q_pos x r_delta_steer; this corner clears both gates (mean |dsteer| < 0.012
    #   rad/step and max lateral error < 0.10 m). Lower r_delta_steer fails the slew
    #   gate; lower q_pos fails the tracking gate.
    #
    # Step 9 re-sweep (2026-10-01, 25 ms-cadence harness, 10 laps, stale 9, fixed
    #   7 ms solve): r_delta_steer 0.1/0.3/0.8/1.5/3/5/8 x q_pos 1/2/4, q_yaw
    #   0.5-8. Even with the servo modelled, lowering r_delta_steer only adds
    #   chatter (0.1: slew 0.022, +0.7 s/lap). 3.0 is the knee: slew 0.0111 (the
    #   first to pass 0.012), 0 % rate saturation, 50.12 s vs 50.23 s; it also
    #   beats 0.8 at stale 14. q_pos is flat; q_yaw 4 is faster but fails slew.
    mpc:
      prediction_horizon: 8             # Steps to predict ahead (see note above on the time budget)
      control_horizon: 3                # Free control moves; must equal max(block_map) + 1
      block_map: [0, 1, 1, 2, 2, 2, 2, 2]  # Move blocking, one entry per prediction step
      maxiter: 25                       # SLSQP iteration cap (warm-started, so a continuation)
      solve_budget_ms: 15.0             # Wall-clock solve budget; past it the plan advances one step
      dt: 0.025                         # Time step [s] (40 Hz)
      # Length of each prediction step [s]; the first must equal dt. Longer
      # later steps buy lookahead with no more decision variables.
      dt_schedule: [0.025, 0.025, 0.05, 0.05, 0.075, 0.075, 0.1, 0.1]
      feedforward: false                # Seed the first steering move from the curvature
      q_pos: 2.0                        # Position tracking weight
      q_yaw: 2.0                        # Yaw tracking weight
      q_vel: 0.5                        # Velocity tracking weight
      r_steer: 0.08                     # Steering control effort weight
      r_accel: 0.01                     # Acceleration control effort weight
      r_delta_steer: 3.0                # Steering rate of change weight (Step 9)
      r_delta_accel: 0.005              # Acceleration rate of change weight

    # The MPC's model of the steering servo, calibrated against the judged plant
    # by least squares (test_steering_actuator.py pins the fit). The plant's own
    # constants (kp 38.19, sv_max 3.2 rad/s, the 0.4189 rad lock) are fixed by
    # the simulator and are deliberately not parameters.
    servo:
      alpha: 0.6903                     # fraction of a small error closed per 25 ms
      d_max: 0.0801                     # [rad] wheel travel per 25 ms at the rate limit
