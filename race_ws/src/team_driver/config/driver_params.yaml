# Your tuning lives here. Loaded with:
#   ros2 run team_driver driver --ros-args --params-file \
#       /hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# or in an evaluation run:
#   ros2 launch roboracer_referee evaluate.launch.py team:=my_team \
#       driver_params:=/hackathon/race_ws/src/team_driver/config/driver_params.yaml
#
# Keeping the numbers out of the code means you can sweep them without
# rebuilding, which is the fastest way to find lap time early on. Declare a
# parameter in driver.py and it can be set here.
#
# The two below are all the template needs, because the template does not
# drive (see driver.py). Expect to replace them entirely.

driver:
  ros__parameters:
    crawl_speed: 1.0          # [m/s]; you ask for a speed and the sim holds it
    max_range: 8.0            # [m] clip the scan here

# MPC Controller Parameters
#
# NOTE: horizon is capped by solve time, not by taste. The control loop runs
# once per LiDAR scan at 40 Hz, so a solve has a 25 ms budget. Measured on this
# machine on the vectorized cost, over a full 700-step lap:
#     horizon  8 ->  30.3 ms mean, 41.0 ms max   (ALREADY OVER BUDGET)
#     horizon 12 -> 139 ms      horizon 16 -> 239 ms      horizon 32 -> 589 ms
# Those figures are for 16 free variables. Move blocking (block_map below) cuts
# them to 6 while keeping the 200 ms lookahead: measured on the harness, solve
# is now ~4.7 ms mean / 6.8 ms p95. Do NOT raise the horizon to buy lookahead:
# the scaling is super-linear. Do NOT go back to 16 variables with the 15 ms
# solve_budget_ms: a cold solve then never finishes inside the budget, every
# solve falls back to the (zero) warm start, and the car never moves.
#
# Weights (tuned 2026-09-28 on maps/icra26_centerline.csv, 700-step lap):
#   The state-tracking to control-rate ratio must exceed 1. A 0.2 m reference snap
#   has to cost more than the steering reversal it causes, or the optimizer
#   chatters: at the old weights a snap was ~57x cheaper than the reversal. Swept
#   q_pos x r_delta_steer; this corner clears both gates (mean |dsteer| < 0.012
#   rad/step and max lateral error < 0.10 m). Lower r_delta_steer fails the slew
#   gate; lower q_pos fails the tracking gate.
mpc:
  ros__parameters:
    prediction_horizon: 8             # Steps to predict ahead (see note above on the time budget)
    control_horizon: 3                # Free control moves; must equal max(block_map) + 1
    block_map: [0, 1, 1, 2, 2, 2, 2, 2]  # Move blocking, one entry per prediction step
    maxiter: 25                       # SLSQP iteration cap (warm-started, so a continuation)
    solve_budget_ms: 15.0             # Wall-clock solve budget; past it the plan advances one step
    dt: 0.025                         # Time step [s] (40 Hz)
    q_pos: 2.0                        # Position tracking weight
    q_yaw: 2.0                        # Yaw tracking weight
    q_vel: 0.5                        # Velocity tracking weight
    r_steer: 0.08                     # Steering control effort weight
    r_accel: 0.01                     # Acceleration control effort weight
    r_delta_steer: 0.8                # Steering rate of change weight
    r_delta_accel: 0.005              # Acceleration rate of change weight